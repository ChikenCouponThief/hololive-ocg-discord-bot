      - name: Test TwStalker
        run: |
          python - <<'PY'
          import requests

          url = "https://twstalker.com/hololive_OCG"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142.0 Safari/537.36"
          }

          r = requests.get(url, headers=headers, timeout=20)

          print("HTTP status:", r.status_code)
          print("HTML length:", len(r.text))
          print("hololive_OCG found:", "hololive_OCG" in r.text)
          print("status links found:", "/status/" in r.text)
          PY
