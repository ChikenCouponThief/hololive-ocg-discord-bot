name: Hololive OCG Discord Bot

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

# 여러 실행이 동시에 last_post.txt를 수정하지 않도록 방지
concurrency:
  group: hololive-ocg-discord-bot
  cancel-in-progress: false

jobs:
  check-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Show run information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC time:"
          date -u

      - name: Check X posts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Save last post
        run: |
          if git diff --quiet last_post.txt; then
            echo "No new post"
          else
            echo "New post detected. Updating last_post.txt..."

            git config user.name "hololive-ocg-bot"
            git config user.email "hololive-ocg-bot@users.noreply.github.com"

            # 변경된 last_post.txt를 잠시 보관
            cp last_post.txt /tmp/last_post.txt

            # GitHub의 최신 main 상태 가져오기
            git fetch origin main
            git reset --hard origin/main

            # 새 게시글 ID 다시 적용
            cp /tmp/last_post.txt last_post.txt

            git add last_post.txt
            git commit -m "Update last post"
            git push origin main
          fi
